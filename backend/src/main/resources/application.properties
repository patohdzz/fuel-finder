# this is how springboot connects to mysql
spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/fuel_finder
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

fuelfinder.osm.import-enabled=${OSM_IMPORT_ENABLED:false}
# Optional -- e.g. "Arlington" to import just one region without touching
# the other regions' code. Blank/unset imports all regions.
fuelfinder.osm.import-region=${OSM_IMPORT_REGION:}

# One-time bootstrap: fills in Regular/Diesel prices for stations that don't
# have any yet, using a real EIA regional average (see PriceSeedService).
# Never overwrites an existing price.
fuelfinder.price-seed.enabled=${PRICE_SEED_ENABLED:false}
